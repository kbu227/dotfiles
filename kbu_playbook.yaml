- hosts: localhost
  become: false
  tasks:
  - name: Sync packages
    become: true
    ansible.builtin.package:
      name:
      - cmake
      - gcc
      - git
      - htop
      - make
      - mc
      - ncdu
      - openssh-server
      - python3
      - python3-pip
      - tmux
      - vim
      - zsh
      - tldr

  - name: set zsh as the main shell
    ansible.builtin.command: usermod --shell /usr/bin/zsh {{ ansible_user_id }}
    become: true
    changed_when: false

  - name: Check if Oh My Zsh installed
    stat:
      path: "{{ ansible_env.HOME }}/.oh-my-zsh"
    register: omz_installed

  - name: download ansible installer
    ansible.builtin.get_url:
      url: https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh
      dest: /tmp/install_omz.sh
      mode: '0755'
    when: not omz_installed.stat.exists

  - name: install omz
    ansible.builtin.command: /tmp/install_omz.sh
    when: not omz_installed.stat.exists

  - name: copy zshrc
    ansible.builtin.copy:
      src: zsh/.zshrc
      dest: /home/{{ ansible_user_id }}/.zshrc
      owner: "{{ ansible_user_id }}"
      group: "{{ ansible_user_id }}"
      mode: '0644'

  - name: copy vimrc
    ansible.builtin.copy:
      src: vim/.vimrc
      dest: /home/{{ ansible_user_id }}/.vimrc
      owner: "{{ ansible_user_id }}"
      group: "{{ ansible_user_id }}"
      mode: '0644'

  - name: create dir for repos
    ansible.builtin.file:
      path: /home/{{ ansible_user_id }}/Repos
      state: directory
      mode: '0755'

  # section for NODE.JS and NPM
  - name: download nvm install script
    ansible.builtin.get_url:
      url: https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh
      dest: /tmp/install_nvm.sh
      mode: '0755'
    when: install_nodejs | int == 1

  - name: run nvm installer
    ansible.builtin.shell: |
      bash /tmp/install_nvm.sh
    args:
      executable: /bin/bash
    when: install_nodejs | int == 1

  - name: install nodejs using nvm
    ansible.builtin.shell: |
      source "/home/{{ ansible_user_id }}/.nvm/nvm.sh"
      nvm install 24
    args:
      executable: /bin/bash
    when: install_nodejs | int == 1

  - name: cron tasks
    cron:
      name: "downloads mess auto cleanup"
      user: "{{ ansible_user_id }}"
      minute: "0"
      hour: "*"
      job: 'find /home/{{ ansible_user_id }}/Downloads -type f -mtime +14 -exec gio trash {} \;'
